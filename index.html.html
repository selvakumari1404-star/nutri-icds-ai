const modules=[
['🍼','breast','Breastfeeding','தாய்ப்பால்','First 6 months: exclusive breastfeeding. From around 6 months, introduce complementary foods while continuing breastfeeding. Support positioning, attachment, responsive feeding and caregiver confidence.','WHO recommends exclusive breastfeeding for the first 6 months. Breastfeeding can continue alongside complementary foods for 2 years or beyond as mutually desired. Seek trained support for persistent feeding difficulties, poor weight gain, maternal illness concerns or infant illness.','Practical points: feed responsively; watch hunger and satiety cues; avoid force-feeding; maintain comfortable positioning; keep routine follow-up.','red'],
['🍲','comp','Complementary Feeding','துணை உணவு','Around 6 months, children need foods in addition to breast milk. Start with soft, safe foods and gradually increase variety, texture, frequency and portion size as the child grows.','6–8 months: commonly 2–3 complementary meals/day. 9–23 months: commonly 3–4 meals/day, with 1–2 nutritious snacks as needed. Continue breastfeeding and increase texture from mashed to lumpy and finger foods according to development.','Use household foods: rice/millet + dal, vegetables, fruit, egg/meat/fish where appropriate, curd, nuts/seeds as safe pastes or powders. Never give whole nuts or other choking hazards to young children.','orange'],
['🥗','balanced','Balanced Diet','சமச்சீர் உணவு','A varied diet helps children receive energy, protein, vitamins and minerals. Include foods from several groups across the day.','Food groups: cereals/millets; pulses/beans; vegetables; fruits; eggs/meat/fish or other protein foods; milk/curd where appropriate; nuts/seeds in safe forms; small amounts of healthy fats. Variety matters more than one “super food”.','Counselling idea: ask “What does the child usually eat in a day?” then suggest one affordable improvement using foods already available at home.','green'],
['🩸','anaemia','Anaemia & Iron','இரத்த சோகை & இரும்புச்சத்து','Iron is needed for blood formation, brain development and normal growth. Young children are at risk of iron deficiency when diets lack iron-rich foods.','Iron-rich foods include meat/fish/eggs and plant sources such as lentils, beans, dark green leafy vegetables and iron-fortified foods where available. Vitamin-C-rich fruits/vegetables can improve absorption of plant iron.','Do not advise medicine or supplement doses from the app. Follow the official programme, local protocol or clinician advice for screening, supplementation and treatment.','red'],
['🥚','protein','Protein Foods','புரத உணவுகள்','Protein supports growth, tissue repair and body functions. Children need regular protein-containing foods as part of a varied diet.','Examples: dal, chickpeas, beans, groundnut paste, egg, fish, chicken, meat, milk/curd and other locally available protein foods. Offer age-appropriate textures and avoid choking hazards.','Combine cereal + pulse foods, for example rice with dal or millet with pulse. Add vegetables and a small amount of fat to improve energy density.','yellow'],
['🍊','micronutrients','Vitamins & Minerals','வைட்டமின்கள் & தாதுக்கள்','Micronutrients support immunity, vision, blood formation, bone health, thyroid function and development.','Vitamin A: colourful vegetables/fruits and appropriate animal foods. Iron: pulses, greens, eggs and animal foods. Iodine: iodized salt. Calcium: milk/curd and other sources. Vitamin C: citrus, guava, tomato and other fruits/vegetables.','Food-based advice should be practical and culturally appropriate. Supplements should only be discussed according to approved programme guidance.','orange'],
['📈','growth','Growth Monitoring','வளர்ச்சி கண்காணிப்பு','Growth monitoring looks at measurements over time rather than a single number. It helps identify children who may need closer assessment or referral.','Use accurate age, weight and length/height measurements. WHO Child Growth Standards include weight-for-age, length/height-for-age, weight-for-length/height and BMI-for-age. Plot and interpret trends correctly.','If growth faltering, severe wasting, oedema, persistent illness or feeding difficulty is suspected, follow the local health-system referral pathway promptly.','blue'],
['💧','hydration','Water & Hydration','தண்ணீர் & நீர்ச்சத்து','Young children need safe fluids and continued breastfeeding. During illness, preventing dehydration is important.','Use safe drinking water. Continue feeding and breastfeeding during illness unless a clinician advises otherwise. For diarrhoea, use ORS and zinc only according to local clinical/public-health guidance.','Urgent referral is needed for danger signs such as inability to drink, repeated vomiting, unusual sleepiness/unconsciousness, convulsions or severe dehydration signs.','blue'],
['🧼','hygiene','Food Hygiene','உணவு சுகாதாரம்','Safe food preparation reduces diarrhoeal disease and food-borne infections. Hygiene counselling should be part of every nutrition session.','Wash hands with soap before preparing food, before feeding, after toilet use and after cleaning a child. Use safe water, clean utensils and clean surfaces. Cook food thoroughly and avoid cross-contamination.','Serve food soon after preparation when possible. Store leftovers safely; discard food that has been kept unsafely. Keep raw and cooked foods separate.','teal'],
['🍌','snacks','Healthy Snacks','ஆரோக்கியமான சிற்றுண்டி','Nutritious snacks can add energy and nutrients between meals, especially for older infants and toddlers who have small stomachs.','Examples: banana or other soft fruit, idli, vegetable upma, soft dosa, curd, boiled egg, dal-based foods, millet preparations, or safe nut/seed paste.','Avoid frequent sugary drinks, sweets and ultra-processed snack foods. Modify texture to the child’s developmental ability.','yellow'],
['⚠️','choking','Choking Safety','மூச்சுத்திணறல் பாதுகாப்பு','Young children are at risk of choking. Food shape, texture and supervision matter.','Avoid whole nuts, whole grapes, hard raw vegetables, popcorn, hard candies and other high-risk foods for young children. Cut foods appropriately and soften them.','Always supervise eating. The child should sit upright and not eat while running, playing or lying down. Learn age-appropriate first aid from an approved provider.','red'],
['🧠','responsive','Responsive Feeding','குழந்தை சைகைகளை கவனித்தல்','Responsive feeding means recognizing hunger and fullness cues and encouraging the child patiently without force.','Hunger cues may include reaching for food, opening the mouth or showing interest. Fullness cues may include turning away, closing the mouth or slowing down. Cues vary by child.','Create a calm meal environment. Offer food repeatedly without pressure. Avoid using food as punishment or reward.','purple'],
['🤒','illness','Nutrition During Illness','நோயின் போது ஊட்டச்சத்து','Illness can reduce appetite and increase nutrition needs. Continued feeding and fluids can support recovery.','Continue breastfeeding. Offer small, frequent meals and fluids. After illness, offer extra nutritious food for a period of recovery according to local guidance.','Refer promptly for danger signs, persistent vomiting, severe diarrhoea, breathing difficulty, severe lethargy, convulsions or other serious concerns.','red'],
['👩‍👧','counsel','Mother & Caregiver Counselling','தாய் & பராமரிப்பாளர் ஆலோசனை','Good counselling is two-way communication. Start with the caregiver’s routine, concerns, budget, food availability and beliefs.','Use open questions, listen without blame, give 1–3 practical actions, demonstrate where possible, ask the caregiver to repeat the plan, and arrange follow-up.','Respect culture while correcting harmful practices. Avoid shame. Use locally available foods and realistic portion/texture advice.','teal'],
['🏠','icds','ICDS / Anganwadi Nutrition','ICDS / அங்கன்வாடி ஊட்டச்சத்து','ICDS frontline workers can support nutrition education, growth monitoring, supplementary nutrition and referral according to programme roles and state protocols.','Key tasks can include identifying nutrition concerns, counselling caregivers, recording growth measurements, supporting supplementary nutrition services and connecting families with health services.','Exact services and reporting formats vary by state and programme updates. Use current official ICDS/Poshan guidance for operational decisions.','purple'],
['🧑‍⚕️','referral','Referral & Red Flags','Referral & ஆபத்து அறிகுறிகள்','Nutrition education should never delay medical care. Frontline workers need clear referral triggers.','Examples of concern: severe wasting, bilateral pitting oedema, significant growth faltering, persistent diarrhoea/vomiting, feeding difficulty, developmental concern or suspected severe anaemia.','Emergency danger signs require urgent medical evaluation. Follow your district/state referral pathway and document follow-up.','red']

async function submitTest(kind){
if(!state.code){alert(t('Please enter a participant code on Home first.','முதலில் முகப்புப் பகுதியில் பங்கேற்பாளர் குறியீட்டை உள்ளிடவும்.'));show('dashboard');return}
if(kind==='pre'&&!state.consent){alert(t('Please confirm the approved consent/information process first.','அங்கீகரிக்கப்பட்ட சம்மதம் மற்றும் தகவல் வழங்கும் செயல்முறை முடிந்ததை முதலில் உறுதி செய்யவும்.'));return}
if(kind==='post' && !state.pre){alert(t('Complete the Pre-Test first.','முதலில் முன் தேர்வை முடிக்கவும்.'));show('pretest');return}
if(kind==='post' && state.modules.length < modules.length){alert(t('Complete all Education topics before the Post-Test.','பின் தேர்வுக்கு முன் அனைத்து கல்விப் பகுதிகளையும் முடிக்கவும்.'));show('education');return}
let ks=0;questions.forEach((q,i)=>{const el=document.querySelector(`[name=k${i}]:checked`); if(el?.dataset.option===q[4])ks++});
let as=0,ps=0,missing=false;att.forEach((_,i)=>{let v=document.querySelector(`[name=a${i}]`)?.value;if(!v)missing=true;as+=+(v||0)});prac.forEach((_,i)=>{let v=document.querySelector(`[name=p${i}]`)?.value;if(!v)missing=true;ps+=+(v||0)});
for(let i=0;i<questions.length;i++)if(!document.querySelector(`[name=k${i}]:checked`))missing=true;
if(missing){alert(t('Please complete every item before submitting.','சமர்ப்பிப்பதற்கு முன் அனைத்து கேள்விகளுக்கும் பதிலளிக்கவும்.'));return}
let result={knowledge:ks,knowledgeMax:questions.length,attitude:as,attitudeMax:att.length*5,practice:ps,practiceMax:prac.length*5,total:ks+as+ps,date:new Date().toISOString()};
state[kind]=result; state[kind==='pre'?'submittedPre':'submittedPost']=true; state.submittedAt=new Date().toISOString(); save();
await syncRecord(kind,result);
alert(t(`${kind==='pre'?'Pre-Test':'Post-Test'} submitted successfully.` ,`${kind==='pre'?'முன் தேர்வு':'பின் தேர்வு'} வெற்றிகரமாக சமர்ப்பிக்கப்பட்டது.`));
show(kind==='pre'?'education':'report');
}
async function syncRecord(kind,result){
 if(!API_URL) return {ok:false,local:true};
 const maxScore = result.knowledgeMax + result.attitudeMax + result.practiceMax;
 const percentage = maxScore ? Math.round((result.total / maxScore) * 10000) / 100 : 0;
 const answers = {};
 questions.forEach((q,i)=>{ const el=document.querySelector(`[name=k${i}]:checked`); answers[`k${i+1}`]=el?el.value:''; });
 att.forEach((q,i)=>{ const el=document.querySelector(`[name=a${i}]`); answers[`a${i+1}`]=el?el.value:''; });
 prac.forEach((q,i)=>{ const el=document.querySelector(`[name=p${i}]`); answers[`p${i+1}`]=el?el.value:''; });
 const payload={
   action:'save',
   participant_id:state.code,
   name:'',
   age_group:state.ageGroup,
   gender:'',
   language:state.lang==='ta'?'Tamil':'English',
   stage:kind==='pre'?'Pre-Test':'Post-Test',
   pre_score:kind==='pre'?result.total:(state.pre?state.pre.total:''),
   post_score:kind==='post'?result.total:'',
   total_questions:maxScore,
   percentage:percentage,
   answers:JSON.stringify(answers),
   completed_at:new Date().toISOString()
 };
 try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); return {ok:r.ok};}catch(e){console.warn('Central sync failed',e);return {ok:false,error:String(e)}}
}

function cleanAIta(title, points, age){

 points=[t('Offer iron-rich foods regularly: dal, beans, green leafy vegetables, egg and, where culturally appropriate, fish/meat.','பருப்பு, பயறு, கீரைகள், முட்டை மற்றும் பொருத்தமான இடங்களில் மீன் அல்லது இறைச்சி போன்ற இரும்புச்சத்து நிறைந்த உணவுகளை தொடர்ந்து வழங்குங்கள்.'),t('Combine plant iron foods with vitamin-C-rich foods such as guava, orange, tomato or other suitable fruits/vegetables to support absorption.','தாவர மூல இரும்புச்சத்து உள்ள உணவுகளுடன் கொய்யா, ஆரஞ்சு, தக்காளி போன்ற வைட்டமின் சி நிறைந்த உணவுகளை சேர்க்கவும்.'),t('Do not guess iron medicine or supplement doses from an AI answer. Follow the current government programme or clinician advice.','செயற்கை நுண்ணறிவு பதிலை வைத்து இரும்பு மருந்து அல்லது சத்து சேர்க்கையின் அளவை தன்னிச்சையாக நிர்ணயிக்க வேண்டாம்; தற்போதைய அரசு திட்ட வழிகாட்டுதல் அல்லது சுகாதார நிபுணரின் ஆலோசனையை பின்பற்றவும்.')];
}else if(q.includes('breast')||q.includes('தாய்ப்பால்')||q.includes('milk')){

 else if(age!==null && age>=6 && age<9) points=[t('At about 6–8 months, complementary foods are commonly offered 2–3 times a day, alongside continued breastfeeding.','சுமார் 6–8 மாதங்களில் துணை உணவை பொதுவாக ஒரு நாளில் 2–3 முறை, தாய்ப்பாலுடன் சேர்த்து வழங்கலாம்.'),t('Begin with soft mashed foods and gradually increase thickness, texture and variety according to development.','மென்மையான மசித்த உணவில் தொடங்கி குழந்தையின் வளர்ச்சி மற்றும் திறனுக்கு ஏற்ப உணவின் கெட்டித்தன்மை, பதம் மற்றும் பல்வகையை படிப்படியாக அதிகரிக்கவும்.')];
 else if(age!==null && age>=9 && age<24) points=[t('At 9–23 months, complementary foods are commonly offered 3–4 times a day, with nutritious snacks as needed, alongside breastfeeding.','9–23 மாதங்களில் துணை உணவை பொதுவாக ஒரு நாளில் 3–4 முறை வழங்கலாம்; தேவைக்கேற்ப சத்தான சிற்றுண்டிகளையும் தாய்ப்பாலையும் தொடரலாம்.'),t('Move toward thicker, lumpy and finger foods as development allows, while supervising eating.','குழந்தையின் வளர்ச்சி திறனுக்கு ஏற்ப கெட்டியான, சிறிது கட்டியுள்ள மற்றும் கையில் பிடித்து சாப்பிடக்கூடிய உணவுகளுக்கு படிப்படியாக மாறுங்கள்; சாப்பிடும் போது கண்காணிக்கவும்.')];
 else points=[t('Around 6 months, complementary foods begin alongside breastfeeding. Frequency, texture and variety increase as the child grows.','சுமார் 6 மாதத்தில் தாய்ப்பாலுடன் துணை உணவைத் தொடங்க வேண்டும்; வயது அதிகரிக்கும்போது உணவின் அடிக்கடி வழங்கும் அளவு, பதம் மற்றும் பல்வகையை அதிகரிக்க வேண்டும்.')];

 points=[t('Use accurate age, weight and length/height measurements.','சரியான வயதை பதிவு செய்து, எடை மற்றும் நீளம் அல்லது உயரத்தை முறையாக அளவிடவும்.'),t('Interpret the trend using the appropriate WHO Child Growth Standard rather than judging from one number alone.','ஒரே ஒரு அளவை வைத்து முடிவு செய்யாமல், பொருத்தமான குழந்தை வளர்ச்சி தரநிலைகளில் காலப்போக்கில் ஏற்பட்ட மாற்றத்தை மதிப்பிடவும்.'),t('If there is suspected growth faltering, severe wasting, oedema, persistent illness or feeding difficulty, follow the local referral pathway.','வளர்ச்சி மந்தம், கடுமையான உடல் மெலிவு, இருபுற கால்வீக்கம், நீடித்த நோய் அல்லது உணவளிப்பதில் சிரமம் இருந்தால் உள்ளூர் பரிந்துரை நடைமுறையை பின்பற்றவும்.')];
}else if(q.includes('water')||q.includes('hydration')||q.includes('தண்ணீர்')||q.includes('diarr')||q.includes('வயிற்றுப்போக்கு')){
 title=t('Hydration / diarrhoea guidance','நீர்ச்சத்து / வயிற்றுப்போக்கு வழிகாட்டுதல்');
 points=[t('Continue breastfeeding and age-appropriate feeding during illness unless a clinician advises otherwise.','நோயின் போது சுகாதார நிபுணர் வேறு அறிவுரை வழங்காவிட்டால் தாய்ப்பாலும் வயதுக்கு ஏற்ற உணவும் தொடர வேண்டும்.'),t('Use safe drinking water. For diarrhoea, ORS and zinc should be used according to current clinical/public-health guidance.','பாதுகாப்பான குடிநீரை பயன்படுத்தவும். வயிற்றுப்போக்கில் வாய்வழி நீரேற்றக் கரைசல் மற்றும் துத்தநாகத்தை தற்போதைய சுகாதார வழிகாட்டுதலின்படி பயன்படுத்தவும்.'),t('Urgent care is needed for danger signs such as inability to drink, repeated vomiting, unusual sleepiness/unconsciousness or convulsions.','குடிக்க முடியாமை, தொடர்ந்து வாந்தி, அதிக தூக்கம் அல்லது உணர்விழப்பு, வலிப்பு போன்ற ஆபத்து அறிகுறிகள் இருந்தால் உடனடி மருத்துவ உதவி தேவை.')];
}else if(q.includes('protein')||q.includes('புரதம்')){
 title=t('Protein food guidance','புரத உணவு வழிகாட்டுதல்');
 points=[t('Offer a protein-containing food regularly: dal, beans, chickpea, egg, fish, meat, groundnut paste or milk/curd where appropriate.','பருப்பு, பயறு, கொண்டைக்கடலை, முட்டை, மீன், இறைச்சி, நிலக்கடலை விழுது அல்லது பொருத்தமான இடங்களில் பால் மற்றும் தயிர் போன்ற புரத உணவுகளை தொடர்ந்து வழங்குங்கள்.'),t('Combine cereal and pulse foods such as rice with dal or millet with pulses.','அரிசி மற்றும் பருப்பு அல்லது சிறுதானியம் மற்றும் பருப்பு போன்ற தானியம் மற்றும் பருப்பு சேர்க்கைகளை பயன்படுத்தலாம்.'),t('Use safe age-appropriate textures and avoid whole nuts for young children because of choking risk.','வயதுக்கு ஏற்ற பாதுகாப்பான உணவுப் பதத்தை பயன்படுத்தவும்; சிறு குழந்தைகளுக்கு மூச்சுத்திணறல் ஆபத்து காரணமாக முழு கொட்டைகளை வழங்க வேண்டாம்.')];
}else if(q.includes('snack')||q.includes('சிற்றுண்டி')){
 title=t('Healthy snack guidance','ஆரோக்கியமான சிற்றுண்டி வழிகாட்டுதல்');
 points=[t('Choose nutrient-dense snacks such as fruit, curd, soft cooked foods or other locally available nutritious options.','பழம், தயிர் மற்றும் மென்மையாக சமைத்த சத்தான உணவுகள் போன்றவற்றை சிற்றுண்டியாக தேர்வு செய்யலாம்.'),t('Limit frequent sugary drinks, sweets and highly processed snack foods.','அதிக சர்க்கரை உள்ள பானங்கள், இனிப்புகள் மற்றும் அதிகமாக பதப்படுத்தப்பட்ட சிற்றுண்டிகளை அடிக்கடி வழங்குவதை குறைக்கவும்.'),t('Supervise eating and match texture to the child’s developmental stage.','சாப்பிடும் போது குழந்தையை கண்காணிக்கவும்; குழந்தையின் வளர்ச்சி திறனுக்கு ஏற்ற உணவுப் பதத்தை வழங்கவும்.')];
}else if(q.includes('hygiene')||q.includes('சுகாதாரம்')||q.includes('hand wash')||q.includes('கை கழுவ')){
 title=t('Food hygiene guidance','உணவு சுகாதார வழிகாட்டுதல்');
 points=[t('Wash hands with soap before preparing food and before feeding the child.','உணவு தயாரிப்பதற்கு முன்பும் குழந்தைக்கு உணவு கொடுப்பதற்கு முன்பும் சோப்பால் கைகளை நன்றாக கழுவவும்.'),t('Keep utensils and preparation surfaces clean and separate raw and cooked foods.','பாத்திரங்கள் மற்றும் உணவு தயாரிக்கும் மேற்பரப்புகளை சுத்தமாக வைத்துக் கொள்ளவும்; சமைக்காத மற்றும் சமைத்த உணவுகளை தனித்தனியாக வைத்திருக்கவும்.'),t('Use safe water and store prepared food safely.','பாதுகாப்பான தண்ணீர் பயன்படுத்தி, தயாரித்த உணவை பாதுகாப்பாக சேமிக்கவும்.')];
}else if(q.includes('chok')||q.includes('choking')||q.includes('மூச்சுத்திணற')){
 title=t('Choking safety guidance','மூச்சுத்திணறல் பாதுகாப்பு வழிகாட்டுதல்');
 points=[t('Avoid whole nuts and other hard, round or sticky high-risk foods for young children.','சிறு குழந்தைகளுக்கு முழு கொட்டைகள் மற்றும் கடினமான, உருண்டையான அல்லது ஒட்டும் மூச்சுத்திணறல் ஆபத்துள்ள உணவுகளை தவிர்க்கவும்.'),t('Soften, mash, grate or cut foods appropriately for age and development.','வயது மற்றும் வளர்ச்சி திறனுக்கு ஏற்ப உணவை மென்மையாக்கி, மசித்து, துருவி அல்லது சிறிய பாதுகாப்பான துண்டுகளாக வெட்டவும்.'),t('Always supervise children while they eat and learn age-appropriate first aid from a qualified source.','குழந்தை சாப்பிடும் போது எப்போதும் கண்காணிக்கவும்; அங்கீகரிக்கப்பட்ட பயிற்சியாளரிடம் வயதுக்கு ஏற்ற முதலுதவி முறைகளை கற்றுக்கொள்ளவும்.')];
}else if(q.includes('how many')||q.includes('எத்தனை')||q.includes('எவ்வளவு')||q.match(/\b\d+\b/)){
 title=t('Number-based question','எண் தொடர்பான கேள்வி');
 if(age!==null && (q.includes('meal')||q.includes('முறை')||q.includes('times'))){
   if(age<6) points=[t('For infants under about 6 months, complementary meal frequency is not applicable because exclusive breastfeeding is generally recommended.','சுமார் 6 மாதத்திற்கு குறைவான குழந்தைக்கு துணை உணவு வேளை பொதுவாக தேவையில்லை; தாய்ப்பால் மட்டும் வழங்குவது பரிந்துரைக்கப்படுகிறது.')];
   else if(age<9) points=[t('At about 6–8 months: commonly 2–3 complementary meals per day, alongside breastfeeding.','சுமார் 6–8 மாதம்: பொதுவாக ஒரு நாளில் 2–3 துணை உணவு வேளைகளை தாய்ப்பாலுடன் வழங்கலாம்.')];
   else if(age<24) points=[t('At 9–23 months: commonly 3–4 complementary meals per day, with nutritious snacks as needed, alongside breastfeeding.','9–23 மாதம்: பொதுவாக ஒரு நாளில் 3–4 துணை உணவு வேளைகளை வழங்கலாம்; தேவைக்கேற்ப சத்தான சிற்றுண்டிகளையும் தாய்ப்பாலையும் தொடரலாம்.')];
   else points=[t('For children 2 years and older, meal patterns depend on the family diet and child’s needs; offer regular balanced meals and nutritious snacks without force-feeding.','2 வயது மற்றும் அதற்கு மேல் உணவு முறை குடும்ப உணவு மற்றும் குழந்தையின் தேவைக்கு ஏற்ப மாறும்; ஒழுங்கான சமச்சீர் உணவையும் சத்தான சிற்றுண்டிகளையும் வழங்கி வற்புறுத்தி உணவளிப்பதை தவிர்க்கவும்.')];
 } else points=[t('Please include the child’s age and what number you want to know (for example, “2 வயது குழந்தைக்கு ஒரு நாளில் எத்தனை meals?”). The app will then give an age-specific educational answer.','குழந்தையின் வயதையும் நீங்கள் அறிய விரும்பும் எண்ணையும் குறிப்பிடுங்கள். உதாரணமாக, “2 வயது குழந்தைக்கு ஒரு நாளில் எத்தனை உணவு வேளை?” என்று கேட்கலாம். அப்போது வயதுக்கேற்ற கல்வி வழிகாட்டுதல் வழங்கப்படும்..')];
}else{
 title=t('General child nutrition guidance','பொதுவான குழந்தை ஊட்டச்சத்து வழிகாட்டுதல்');
 points=[t('Offer a variety of affordable, locally available foods across the day.','நாள் முழுவதும் குடும்பத்திற்கு கிடைக்கக்கூடிய மற்றும் செலவுக்கு ஏற்ற பல்வேறு உணவுகளை வழங்கவும்.'),t('Respond to hunger and fullness cues and avoid force-feeding.','குழந்தையின் பசி மற்றும் நிறைவு சைகைகளை கவனித்து உணவளிக்கவும்; வற்புறுத்தி உணவளிப்பதை தவிர்க்கவும்.'),t('If there is poor growth, persistent illness, feeding difficulty or any danger sign, use the appropriate health-service referral pathway.','வளர்ச்சி குறைவு, நீடித்த நோய், உணவளிப்பதில் சிரமம் அல்லது ஆபத்து அறிகுறிகள் இருந்தால் பொருத்தமான சுகாதார சேவைக்கு பரிந்துரைக்கும் நடைமுறையை பின்பற்றவும்.')];
}
if(lang==='ta'){ const ca=cleanAIta(title,points,age); title=ca.title; points=ca.points; warning='இது கல்வி சார்ந்த வழிகாட்டுதல் மட்டுமே. நோயறிதல், மருந்து அளவு அல்லது அவசர முடிவுகளுக்குப் பயன்படுத்த வேண்டாம்.'; }
state.aiLog.push({q:raw.slice(0,300),time:new Date().toISOString()});state.aiLog=state.aiLog.slice(-20);save();
document.getElementById('answer').innerHTML=`<div class="box"><b>${title}</b>${age!==null?`<span class="tag">${t('Age detected:','கண்டறியப்பட்ட வயது:')} ${age} ${t('years','வயது')}</span>`:''}<ul>${points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box warn">⚠️ ${warning}</div><p class="source"><b>${t('Evidence base:','ஆதார அடிப்படை:')}</b> ${t(src,'WHO குழந்தை மற்றும் சிறு குழந்தை உணவளிப்பு மற்றும் ஊட்டச்சத்து வழிகாட்டுதல்கள்.')}</p>`
}
function report(){
let p=state.pre,o=state.post;
let content=!p||!o?`<div class="box warn">${t('Complete both Pre-Test and Post-Test to compare scores.','முன் தேர்வு மற்றும் பின் தேர்வு இரண்டையும் முடித்த பிறகு மதிப்பெண் ஒப்பீட்டை பார்க்கலாம்.')}</div>`:`<div class="stats"><div class="stat"><b>${p.knowledge} → ${o.knowledge}</b><div>${lang==='ta'?'அறிவு / '+p.knowledgeMax:'Knowledge / '+p.knowledgeMax}</div></div><div class="stat"><b>${p.attitude} → ${o.attitude}</b><div>${lang==='ta'?'அணுகுமுறை / '+p.attitudeMax:'Attitude / '+p.attitudeMax}</div></div><div class="stat"><b>${p.practice} → ${o.practice}</b><div>${lang==='ta'?'நடைமுறை / '+p.practiceMax:'Practice / '+p.practiceMax}</div></div></div><div class="box"><div class="score">${lang==='ta'?'மொத்தம்':'Total'}: ${p.total} → ${o.total}</div><p>${lang==='ta'?'மாற்றம்':'Change'}: ${o.total-p.total} ${lang==='ta'?'புள்ளிகள்':'points'}</p></div><div class="box">${lang==='ta'?'இது விளக்கமான ஒப்பீடு மட்டுமே. இறுதி புள்ளியியல் பகுப்பாய்வு அங்கீகரிக்கப்பட்ட ஆய்வு திட்டம் மற்றும் வடிவமைப்பின்படி செய்யப்பட வேண்டும்.':'Descriptive comparison only. Final statistical analysis should follow the approved protocol and study design.'}</div>`;
document.getElementById('app').innerHTML=`<section class="page"><h2>📋 ${t('Pre/Post Report','முன் / பின் தேர்வு அறிக்கை')}</h2><div class="box">${t('Each submitted timepoint can be sent to the researcher spreadsheet when API_URL is configured.','API_URL அமைக்கப்பட்டிருந்தால் ஒவ்வொரு சமர்ப்பிப்பும் ஆய்வாளர் அட்டவணைக்கு அனுப்பப்படும்.')}</div><p><b>${t('Code:','குறியீடு:')}</b> ${esc(state.code)||'—'}</p>${content}<div class="module-actions"><button class="primary" onclick="downloadCSV()">⬇️ ${t('Export CSV','அட்டவணை கோப்பை ஏற்றுமதி செய்யவும்')}</button><button onclick="window.print()">🖨️ ${t('Print','அச்சிடுக')}</button></div></section>`}
function downloadCSV(){
let rows=[['Participant','AgeGroup','Language','Timepoint','Knowledge','KnowledgeMax','Attitude','AttitudeMax','Practice','PracticeMax','Total','Timestamp'],[state.code,state.ageGroup,state.lang,'Pre',state.pre?.knowledge||'',state.pre?.knowledgeMax||'',state.pre?.attitude||'',state.pre?.attitudeMax||'',state.pre?.practice||'',state.pre?.practiceMax||'',state.pre?.total||'',state.pre?.date||''],[state.code,state.ageGroup,state.lang,'Post',state.post?.knowledge||'',state.post?.knowledgeMax||'',state.post?.attitude||'',state.post?.attitudeMax||'',state.post?.practice||'',state.post?.practiceMax||'',state.post?.total||'',state.post?.date||'']];
let csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\\n');
let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Nutri_ICDS_KAP_'+(state.code||'participant')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setLanguage(v){lang=v;state.lang=v;save();location.reload()}
function toggleLang(){setLanguage(lang==='ta'?'en':'ta')}
function clearAll(){if(confirm(t('Reset all prototype data on this device?','இந்த சாதனத்தில் உள்ள முன்மாதிரி தரவுகள் அனைத்தையும் மீட்டமைக்கவா?'))){localStorage.removeItem(KEY);location.reload()}}
function show(id){if(id==='dashboard')dashboard();else if(id==='pretest')renderTest('pre');else if(id==='posttest'){if(!state.pre){alert(t('Complete the Pre-Test first.','முதலில் முன் தேர்வை முடிக்கவும்.'));return;} if(state.modules.length<modules.length){alert(t('Complete all Education topics before the Post-Test.','பின் தேர்வுக்கு முன் அனைத்து கல்விப் பகுதிகளையும் முடிக்கவும்.'));show('education');return;} renderTest('post')}else if(id==='education')education();else if(id==='ai')ai();else if(id==='report')report()}
document.documentElement.lang=lang;
show('dashboard');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
